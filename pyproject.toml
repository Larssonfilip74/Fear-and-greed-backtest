[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fgbt"
version = "0.1.0"
description = "Research and backtesting of ES/NQ futures against the CNN Fear & Greed index"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "statsmodels==0.15.0",
    "arch==8.0.0",
    "pyarrow==25.0.1",
    "matplotlib==3.11.2",
    "exchange_calendars==4.13.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
